name: Build LCInterlocking Extended

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        run: python scripts/static_check.py

      - name: Build complete workbench
        run: python scripts/build_dist.py

      - name: Validate generated package metadata
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'dist/LCInterlockingExtended/package.xml'
          ET.parse(p)
          print('package.xml OK')
          PY

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../LCInterlockingExtended-${GITHUB_REF_NAME}.zip LCInterlockingExtended

      - name: Publish generated dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/distbranch
          mkdir /tmp/distbranch
          cp -a dist/LCInterlockingExtended/. /tmp/distbranch/
          cd /tmp/distbranch
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generated from ${GITHUB_SHA}"
          git branch -M dist
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LCInterlockingExtended-${{ github.ref_name }}.zip
